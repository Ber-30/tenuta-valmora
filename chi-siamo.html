  <!-- Script JS -->
  <script>
/* Native, reversible scroll progress. No scroll interception or external dependencies. */
(() => {
  const history = document.querySelector('.about-history');
  if (!history) return;
  const panel = history.querySelector('.about-history-panel');
  const steps = [...history.querySelectorAll('.about-generations li')];
  const header = document.querySelector('.site-header');
  const panorama = document.querySelector('.about-panorama-frame');
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let frame = 0;
  let headerHeight = 80;

  const clamp = value => Math.min(1, Math.max(0, value));

  function paint() {
    frame = 0;
    if (motion.matches) return;
    const bounds = history.getBoundingClientRect();
    const pinned = history.classList.contains('is-pinned');
    const distance = pinned ? bounds.height - panel.getBoundingClientRect().height : bounds.height;
    const rawProgress = clamp((pinned ? headerHeight - bounds.top : innerHeight * .65 - bounds.top) / Math.max(1, distance));
    // Snap fractional scroll-pixel rounding at the two endpoints.
    const progress = rawProgress > .995 ? 1 : rawProgress < .005 ? 0 : rawProgress;
    history.style.setProperty('--history-progress', progress.toFixed(4));
    const current = Math.min(3, Math.floor(progress * 3 + .003));
    steps.forEach((step, index) => {
      step.classList.toggle('is-reached', index <= current);
      step.classList.toggle('is-current', index === current);
      if (index === current) step.setAttribute('aria-current', 'step');
      else step.removeAttribute('aria-current');
    });
    if (panorama) {
      const rect = panorama.getBoundingClientRect();
      if (rect.bottom > 0 && rect.top < innerHeight) {
        const offset = clamp((innerHeight - rect.top) / (innerHeight + rect.height));
        panorama.style.setProperty('--panorama-y', `${-8 + offset * 6}%`);
      }
    }
  }

  function schedule() {
    if (!frame) frame = requestAnimationFrame(paint);
  }

  function measure() {
    headerHeight = header ? header.getBoundingClientRect().height : 0;
    document.body.style.setProperty('--about-header-height', `${headerHeight}px`);
    history.classList.remove('is-pinned');
    history.classList.toggle('has-scroll-motion', !motion.matches);
    if (!motion.matches) {
      history.classList.add('is-pinned');
      // Small/landscape viewports must never crop content inside a pinned panel.
      if (panel.scrollHeight > panel.clientHeight + 1) history.classList.remove('is-pinned');
    } else {
      history.style.removeProperty('--history-progress');
      steps.forEach(step => {
        step.classList.remove('is-current', 'is-reached');
        step.removeAttribute('aria-current');
      });
      panorama?.style.removeProperty('--panorama-y');
    }
    const track = history.querySelector('.about-timeline-track');
    if (matchMedia('(max-width: 760px)').matches) {
      const first = steps[0].querySelector('.about-generation-dot').getBoundingClientRect();
      const last = steps[3].querySelector('.about-generation-dot').getBoundingClientRect();
      track.style.height = `${last.top - first.top}px`;
    } else track.style.removeProperty('height');
    schedule();
  }

  if ('IntersectionObserver' in window && !motion.matches) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: .08 });
    document.querySelectorAll('[data-about-reveal]').forEach(el => observer.observe(el));
    document.body.classList.add('has-reveals');
  }

  addEventListener('scroll', schedule, { passive: true });
  addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  motion.addEventListener('change', measure);
  if (document.fonts) document.fonts.ready.then(measure);
  measure();
})();

  </script>
